# A pod of the service `web`: one container, which runs zathras. zathras
# fetches into /nix/store whatever draal rolls out, from the store draal
# keeps, and runs it. The pod holds no image of the service and has no
# sidecar, and its container is given nothing a container does not have:
# no capability, and the runtime's own AppArmor and seccomp profiles.
#
# What to change: draal's endpoint ID, and the name of the service. In a
# Deployment or a StatefulSet the `spec` below is the template's, and
# every pod is a zathras under its own name.
#
# The role key of the service is made first, on the laptop. Every pod of
# the service is given the same one, as a Secret, and an admin grants it
# the role for the service:
#
#   great-machine id --key zathras-web.key        # makes the key, prints its ID
#   kubectl create secret generic web-zathras-key \
#     --from-file=zathras.key=zathras-web.key
#   great-machine access grant zathras ID --service web
#
# A zathras registers with what that key signed for it. One whose role
# key was not granted its service is refused by draal, and says so in
# its log.
apiVersion: v1
kind: Pod
metadata:
  name: web-example
spec:
  # zathras gives the service 2 minutes to end after SIGTERM
  # (--stop-timeout) before it kills it. The kubelet has to wait longer
  # than that, or it kills zathras first.
  terminationGracePeriodSeconds: 150
  containers:
    - name: app
      # The image has zathras, a shell and its tools, and nothing of the
      # service: that comes from the store.
      # The same tag as draal: draal and every zathras are kept on one tag,
      # because a draal and a zathras of different versions may not speak
      # the same protocol. v0.4.0 is the first release whose zathras
      # registers with its role key, which exists once it has been tagged.
      image: ghcr.io/fables-for-robots/great-machine:v0.4.0
      command: ["great-machine", "zathras"]
      securityContext:
        # zathras mounts nothing: it writes what it fetches into
        # /nix/store as files, and needs nothing for that which a
        # container does not have. A namespace that enforces the Pod
        # Security Standards admits this pod at the level `baseline`.
        #
        # No process of the container gains a privilege by executing a
        # program, a setuid one or one with file capabilities: zathras
        # has no need to, so the service and the shells cannot.
        allowPrivilegeEscalation: false
        # The runtime's seccomp profile, written out because a pod that
        # says nothing has none at all on most clusters.
        seccompProfile:
          type: RuntimeDefault
        # A pod that was left with what v0.2.0 gave its container,
        # CAP_SYS_ADMIN and no AppArmor profile, still runs, and zathras
        # warns when it starts: nothing takes the capability from a
        # service that is root any more.
      env:
        - name: GREAT_MACHINE_DRAAL
          value: "1111111111111111111111111111111111111111111111111111111111111111"
        - name: GREAT_MACHINE_SERVICE
          value: web
        # The role key of the service, from the Secret below. zathras
        # does not make the file: one that is missing ends it at its
        # start.
        - name: GREAT_MACHINE_ROLE_KEY
          value: /run/secrets/great-machine/zathras.key
        # The name the operator sees is the host name, which is the pod's
        # name.
        #
        # The user and the group the service and the shells run as. Not
        # set: those of zathras, which is root. A service that is root
        # can write the store it runs from, and the pack cache, and
        # reads the role key, with which it could sign for zathrases of
        # its own service. One that is another user can do none of it:
        # the two directories are zathras's alone to write, and the role
        # key is root's alone to read.
        # - name: GREAT_MACHINE_USER
        #   value: "1000:1000"
      volumeMounts:
        - name: store
          mountPath: /nix/store
        - name: cache
          mountPath: /var/cache/great-machine
        - name: role-key
          mountPath: /run/secrets/great-machine
          readOnly: true
      # What the container needs of memory and CPU is what the service
      # needs and what zathras needs to fetch a closure and to write it
      # out: the two count together.
      #
      # Ready while the service runs, and at no other time: not before
      # the first rollout, not while the service waits to be started
      # again. Not a liveness probe: that would have the kubelet restart
      # the container of a service that stays down, and with the
      # container go the backoff of zathras, its log and its identity.
      readinessProbe:
        httpGet:
          path: /healthz
          port: 9890
        periodSeconds: 2
        failureThreshold: 1
  volumes:
    # The store of the pod: every store path zathras has fetched, as
    # files. It lives as long as the pod, across restarts of the
    # container, so a container that is started again finds its store.
    # Without this volume the store is the container's own, and a
    # container that is started again writes every store path out anew
    # from the cache, downloading nothing.
    - name: store
      emptyDir: {}
    # The pack cache: every store path once more, as it was pulled, so
    # that a store path a rollout changed costs the pod the download of
    # what changed. Nothing is ever removed from either volume: a pod's
    # disk holds every store path it was given twice.
    - name: cache
      emptyDir: {}
    # The role key of the service: the Secret that was made first (see
    # the top of this file), as a file that root alone reads. It is in
    # the container the service runs in, which is why a service is given
    # a role key of its own: a key that was granted for one service signs
    # for no other.
    - name: role-key
      secret:
        secretName: web-zathras-key
        defaultMode: 0400
