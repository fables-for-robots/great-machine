name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Every `run` step runs in the flake's bare shell, which has the Go,
    # the sqlc and the Node that the dev shell has. A step added here
    # needs no setup of its own for them.
    defaults:
      run:
        shell: nix develop .#bare --command bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'flake.lock') }}
          restore-keys: go-${{ runner.os }}-
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      # db/dbq is what sqlc makes of db/queries and db/migrations, and
      # nothing else: a query that was changed without `go generate ./db`
      # fails here.
      - name: sqlc
        run: sqlc diff
      # The page: its dependencies as package-lock.json names them, the
      # type check, the unit tests, and the build into web/dist. A build
      # leaves nothing that git sees: web/dist is ignored but for its
      # placeholder, which the build keeps.
      - name: ui
        run: |
          cd ui
          npm ci
          npm run check
          npm test
          npm run build
          test -z "$(git status --porcelain)"
      # `test` above ran without the page, as the Go module has to build
      # and pass without it. The packages that serve the page run once
      # more now that web/dist holds it.
      - name: test with the page
        run: go test -count=1 ./web/... ./cli/ ./e2e/
      - name: pid1
        run: scripts/test-pid1.sh
      # The tests that need root and the kernel: a service and a shell
      # started as another user (--user), and given the pipes and the
      # terminal they are started on. They run in a container that is
      # given nothing, no capability beyond Docker's defaults and
      # Docker's own AppArmor profile, which is what a pod's container
      # has (deploy/pod.yaml): that this is enough is part of what the
      # step shows.
      - name: linux, as root
        run: scripts/test-linux.sh
      # Steps that test more are added above this line. The last steps
      # build the program as a release does: Nix builds the page by
      # itself and puts it into the program, whatever the steps above
      # left in web/dist, which git ignores and Nix therefore does not
      # see. gonixgo runs a program while Nix evaluates, which Nix allows
      # only when asked.
      - name: nix build
        run: |
          nix build --option allow-unsafe-native-code-during-evaluation true
          ./result/bin/great-machine version
          # The program that Nix built has the page: its `web` is asked
          # for it, with the link it prints.
          scripts/test-page.sh ./result/bin/great-machine
      # The image as a release builds it, and what a pod asks of it: that
      # it has an empty /nix/store for the store of the pod, and runs with
      # a volume put over it.
      - name: image
        run: |
          nix build .#image --option allow-unsafe-native-code-during-evaluation true
          docker load < result
          docker run --rm --tmpfs /nix/store ghcr.io/fables-for-robots/great-machine:nix version
          docker run --rm --entrypoint sh ghcr.io/fables-for-robots/great-machine:nix \
            -c 'test -d /nix/store && test -z "$(ls -A /nix/store)" && test -d /var/cache/great-machine'
          docker run --rm --tmpfs /nix/store --entrypoint sh ghcr.io/fables-for-robots/great-machine:nix \
            -c 'test -d /tmp && test -s /etc/ssl/certs/ca-certificates.crt'
          # The program of the image has the page.
          scripts/test-page.sh --image ghcr.io/fables-for-robots/great-machine:nix
